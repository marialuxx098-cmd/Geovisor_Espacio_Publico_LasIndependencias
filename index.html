<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geovisor de Medellin</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <!-- Panel de capas (izquierda) -->
  <aside id="panel">
    <header>
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 3 7l9 5 9-5-9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/></svg></div>
      <div class="ttl"><b>Geovisor</b><span>Capas geograficas de Medellin</span></div>
      <button id="panelToggle" class="icon-btn" title="Contraer / expandir"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </header>
    <div id="panelBody">
      <h4>Mapa base</h4>
      <div id="basemaps" class="chips"></div>
      <h4>Capas <span id="count"></span></h4>
      <ul id="layerList"></ul>
    </div>
  </aside>

  <!-- Menú de herramientas plegable (derecha) -->
  <div id="tools">
    <button id="toolsBtn" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>Herramientas</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="toolsMenu">
      <h4>Dibujar</h4>
      <div class="grid">
        <button data-tool="point"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>Punto</button>
        <button data-tool="line"><svg viewBox="0 0 24 24"><path d="M4 19 10 9l5 6 5-10"/><circle cx="4" cy="19" r="1.5"/><circle cx="20" cy="5" r="1.5"/></svg>Línea</button>
        <button data-tool="polygon"><svg viewBox="0 0 24 24"><path d="m12 3 8.5 6.5-3.2 10.5H6.7L3.5 9.5 12 3Z"/></svg>Polígono</button>
      </div>
      <h4>Medir</h4>
      <div class="grid two">
        <button data-tool="dist"><svg viewBox="0 0 24 24"><path d="m3 17 14-14 4 4L7 21Zm4-4 2 2m1-5 2 2m1-5 2 2"/></svg>Distancia</button>
        <button data-tool="area"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4Z"/><path d="M4 9h4m-4 4h4m4-8v4m4-4v4"/></svg>Área</button>
      </div>
      <button id="clearBtn" class="ghost"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar dibujos</button>
    </div>
  </div>

  <div id="hint"><span id="hintText"></span><button id="finishBtn">Finalizar</button><button id="cancelBtn" class="ghost">Cancelar</button></div>
  <div id="coords">Lat: -- | Lon: --</div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/shp.js"></script>
  <script src="scripts.js?v=20261028-2"></script>
</body>
</html>
